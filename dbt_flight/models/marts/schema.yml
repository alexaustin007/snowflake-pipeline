version: 2

models:
  - name: fct_clean_routes
    description: Cleaned and standardized routes table, the main fact table
    columns:
      - name: route_key
        tests:
          - not_null
      - name: airline_code
        tests:
          - not_null
      - name: distance_category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SHORT', 'MEDIUM', 'LONG']

  - name: fct_enriched_routes
    description: Cortex AI enriched routes with classification and summary
    columns:
      - name: route_key
        tests:
          - not_null
      - name: route_classification
        tests:
          - not_null

  - name: v_route_summary
    description: Per-route aggregated summary view
  - name: v_airline_stats
    description: Per-airline statistics view
  - name: v_busiest_airports
    description: Busiest airports by total flight appearances